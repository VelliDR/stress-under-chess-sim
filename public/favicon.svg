  <rect x="13" y="2" width="1" height="1" fill="#7dd3fc"/>
  <rect x="12" y="3" width="3" height="2" fill="#38bdf8"/>
  <rect x="13" y="3" width="1" height="1" fill="#e0f2fe"/>
  <rect x="13" y="5" width="1" height="1" fill="#0284c7"/>
