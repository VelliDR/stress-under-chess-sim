<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#090c13"/>
  <!-- Royal Cross (cracked golden crown) -->
  <rect x="6" y="0" width="4" height="1" fill="#070a12"/>
  <rect x="6" y="1" width="1" height="1" fill="#070a12"/>
  <rect x="7" y="1" width="2" height="1" fill="#facc15"/>
  <rect x="9" y="1" width="1" height="1" fill="#070a12"/>
  <rect x="4" y="2" width="2" height="1" fill="#070a12"/>
  <rect x="6" y="2" width="1" height="1" fill="#facc15"/>
  <rect x="7" y="2" width="1" height="1" fill="#fef08a"/>
  <rect x="8" y="2" width="1" height="1" fill="#facc15"/>
  <rect x="9" y="2" width="3" height="1" fill="#070a12"/>
  <rect x="4" y="3" width="1" height="1" fill="#070a12"/>
  <rect x="5" y="3" width="1" height="1" fill="#facc15"/>
  <rect x="6" y="3" width="3" height="1" fill="#fef08a"/>
  <rect x="9" y="3" width="1" height="1" fill="#f59e0b"/>
  <rect x="10" y="3" width="2" height="1" fill="#070a12"/>
  <!-- King Crown Dome with crack -->
  <rect x="3" y="5" width="10" height="4" fill="#e0f2fe"/>
