  <!-- Gold collar -->
  <rect x="3" y="9" width="10" height="1" fill="#facc15"/>
  <!-- Torso & Base -->
  <rect x="4" y="10" width="8" height="3" fill="#dbeafe"/>
  <rect x="9" y="10" width="3" height="3" fill="#93c5fd"/>
  <rect x="2" y="13" width="12" height="2" fill="#2563eb"/>
